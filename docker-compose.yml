services:
  postgres:
    image: postgres:16-alpine
    container_name: serper-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: serper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-serper_secret}
      POSTGRES_DB: serper
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U serper -d serper']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serper-internal

  redis:
    image: redis:7-alpine
    container_name: serper-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serper-internal

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: serper-api
    restart: unless-stopped
    ports:
      - '${API_PORT:-8080}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://serper:${POSTGRES_PASSWORD:-serper_secret}@postgres:5432/serper?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-refresh}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH: /usr/bin/chromium-browser
      PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser
      API_DOMAIN: ${API_DOMAIN:-api.noviqsearch.online}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.noviqsearch.online}
      APP_URL: ${APP_URL:-https://noviqsearch.online}
      APP_NAME: ${APP_NAME:-NoviqSearch}
      DEFAULT_FREE_CREDITS: ${DEFAULT_FREE_CREDITS:-2700}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://noviqsearch.online,https://api.noviqsearch.online}
      EFI_CLIENT_ID: ${EFI_CLIENT_ID:-}
      EFI_CLIENT_SECRET: ${EFI_CLIENT_SECRET:-}
      EFI_PIX_KEY: ${EFI_PIX_KEY:-}
      EFI_SANDBOX: ${EFI_SANDBOX:-false}
      EFI_CERTIFICATE_PATH: ${EFI_CERTIFICATE_PATH:-/app/certs/efi-producao.p12}
      EFI_WEBHOOK_SECRET: ${EFI_WEBHOOK_SECRET:-}
      CREDIT_PACK_PRICE_CENTS: ${CREDIT_PACK_PRICE_CENTS:-500}
      CREDIT_PACK_CREDITS: ${CREDIT_PACK_CREDITS:-500}
      OVERAGE_BLOCK_CREDITS: ${OVERAGE_BLOCK_CREDITS:-500}
    volumes:
      - ./certs:/app/certs:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    networks:
      - serper-internal

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://api.noviqsearch.online/api/v1}
    container_name: noviqsearch-web
    restart: unless-stopped
    ports:
      - '${WEB_PORT:-3080}:3000'
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - serper-internal

  nginx:
    image: nginx:alpine
    container_name: serper-nginx
    restart: unless-stopped
    profiles:
      - bundled-nginx
    ports:
      - '${HTTP_PORT:-80}:80'
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api
    networks:
      - serper-internal

  prometheus:
    image: prom/prometheus:latest
    container_name: serper-prometheus
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - '127.0.0.1:9090:9090'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - serper-internal

  grafana:
    image: grafana/grafana:latest
    container_name: serper-grafana
    restart: unless-stopped
    profiles:
      - monitoring
    ports:
      - '127.0.0.1:3001:3000'
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - serper-internal

networks:
  serper-internal:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
