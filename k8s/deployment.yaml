apiVersion: apps/v1
kind: Deployment
metadata:
  name: serper-api
  labels:
    app: serper-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: serper-api
  template:
    metadata:
      labels:
        app: serper-api
    spec:
      containers:
        - name: api
          image: serper-platform:latest
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: serper-secrets
          resources:
            requests:
              memory: '512Mi'
              cpu: '250m'
            limits:
              memory: '1Gi'
              cpu: '1000m'
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: serper-api
spec:
  selector:
    app: serper-api
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: serper-api-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: serper-api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
