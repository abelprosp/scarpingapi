# Use SOMENTE na primeira emissão do certificado SSL (antes do HTTPS existir).
# Copie para /etc/nginx/sites-available/api.noviqsearch.online
# Depois do certbot, substitua por api.noviqsearch.online.conf

server {
    listen 80;
    listen [::]:80;
    server_name api.noviqsearch.online;

    client_max_body_size 10M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
