# Nginx do HOST (VPS) — copiar para /etc/nginx/sites-available/api.noviqsearch.online
# ln -sf /etc/nginx/sites-available/api.noviqsearch.online /etc/nginx/sites-enabled/
#
# Pré-requisito: API Docker escutando em 127.0.0.1:8080 (API_PORT=8080 no .env)
# Certificado: certbot certonly --nginx -d api.noviqsearch.online

# Redireciona HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name api.noviqsearch.online;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS → API NestJS
server {
    listen 443 ssl http2;
    listen [::]:443 ssl;
    server_name api.noviqsearch.online;

    ssl_certificate /etc/letsencrypt/live/api.noviqsearch.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.noviqsearch.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }
}
